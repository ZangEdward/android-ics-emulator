<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Android 4.0 ICS 模拟器 · AOSP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#33b5e5; --blue-d:#0099cc;
    --green:#99cc00; --green-d:#669900;
    --red:#ff4444; --orange:#ffbb33; --purple:#aa66cc;
    --bg:#000; --panel:#0e0e0e; --divider:#191919;
    --txt:#fff; --txt2:#bebebe; --hint:#808080;
    --hl:rgba(51,181,229,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;touch-action:manipulation;}
  img,svg{-webkit-user-drag:none;user-select:none;pointer-events:auto;}
  html,body{height:100%;}
  body{font-family:'Roboto',sans-serif;background:#000 url(assets/aosp_wallpaper.svg) center/cover no-repeat fixed;
    color:var(--txt);overflow:hidden;}
  /* prevent white/black flash on load: screen transparent so body wallpaper shows immediately */
  .device{width:100vw;height:100vh;background:transparent;position:relative;overflow:hidden;display:flex;flex-direction:column;}
  .screen{width:100%;height:100%;background:transparent;overflow:hidden;position:relative;display:flex;flex-direction:column;flex:1;min-height:0;}
  .wallpaper{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;background-image:url(assets/aosp_wallpaper.svg);}

  /* ===== status bar (ICS status_bar.xml: notif icons left, signal/battery cluster + BLUE clock right) ===== */
  .statusbar{height:25px;background:linear-gradient(180deg,#262626,#171717);display:flex;align-items:center;
    padding:0 6px;font-size:12px;font-weight:400;color:#fff;flex-shrink:0;position:relative;z-index:40;
    box-shadow:inset 0 -1px 0 rgba(0,0,0,.8);}
  .sb-left{flex:1;display:flex;align-items:center;gap:4px;overflow:hidden;}
  .sb-left i{width:14px;height:14px;display:inline-flex;}
  .sb-left svg{width:14px;height:14px;fill:#fff;}
  .sb-left img{width:14px;height:14px;object-fit:contain;}
  .sb-cluster{display:flex;align-items:center;gap:3px;padding-left:2px;}
  /* real AOSP status icons (stat_sys_wifi_signal_4 / stat_sys_signal_4 / stat_sys_battery_100) */
  .sb-wifi{height:13px;width:auto;}
  .sb-sig{height:13px;width:auto;}
  .sb-batt{height:13px;width:auto;}
  /* TextAppearance.StatusBar.Clock: 16dp, holo_blue_light #33b5e5 */
  #sbClock{font-weight:400;text-align:left;padding-left:6px;color:#33b5e5;font-size:15px;line-height:1;}

  /* ===== screens ===== */
  .screen-page{flex:1;overflow-y:auto;position:relative;display:none;z-index:1;background:var(--bg);}
  .screen-page.on{display:flex;flex-direction:column;animation:scrIn .28s cubic-bezier(.2,.7,.3,1);will-change:transform,opacity;}
  @keyframes scrIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  /* signature ICS app-open: zoom up from the tapped launcher icon */
  .screen-page.app-open{animation:appOpen .32s cubic-bezier(.2,.7,.3,1);}
  @keyframes appOpen{from{transform:translate(var(--ox,0),var(--oy,0)) scale(var(--os,.5));opacity:.35}to{transform:translate(0,0) scale(1);opacity:1}}
  /* ICS app drawer: slides up from the dock */
  .screen-page.drawer-open{animation:drUp .28s cubic-bezier(.2,.8,.3,1);}
  @keyframes drUp{from{transform:scale(.92);opacity:.25}to{transform:scale(1);opacity:1}}

  /* wallpaper-visible screens (lock / home) — keep transparent so wallpaper shows */
  .wall{background:transparent;}

  /* ===== lock screen (ICS keyguard_screen_tab_unlock.xml + MultiWaveView) ===== */
  #lock{flex-direction:column;}
  #lock.on{animation:lockIn .4s cubic-bezier(.2,.7,.3,1);}
  @keyframes lockIn{from{opacity:0}to{opacity:1}}
  #lock .lock-clock,#lock .lock-date{animation:lockUp .5s cubic-bezier(.2,.7,.3,1);}
  @keyframes lockUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  #lock .mwv,#lock .lock-carrier{animation:lockRing .55s cubic-bezier(.2,.7,.3,1) .08s backwards;}
  @keyframes lockRing{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
  .lock-top{display:flex;flex-direction:column;align-items:center;padding:15vh 0 0;flex-shrink:0;width:100%;}
  .lock-clock{font-size:54px;font-weight:200;letter-spacing:1px;line-height:1;color:#fff;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.45);}
  .lock-date{font-size:13px;color:rgba(255,255,255,.88);margin-top:8px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.45);}
  .lock-space{flex:1;}
  .lock-ringzone{position:relative;height:280px;flex-shrink:0;margin-bottom:30px;}
  /* AOSP ICS LockScreen MultiWaveView (real): ONE wave ring = ic_lockscreen_outerring shape oval 270dp.
     Idle: circle centered on handle. While dragging: the ring FOLLOWS the handle and stretches
     horizontally (scaleX) into an ellipse — exactly like MultiWaveView.onDraw + mOuterRing scale. */
  .mwv{position:absolute;left:0;right:0;top:0;bottom:30px;}
  .mwv-wave{position:absolute;left:50%;top:50%;width:270px;height:270px;margin:-135px 0 0 -135px;
    border-radius:50%;border:2px solid rgba(26,255,255,.30);pointer-events:none;z-index:1;
    transition:transform .2s cubic-bezier(.2,.7,.3,1);will-change:transform;}
  .mwv-wave.drag{transition:none;}
  /* drag-guide line from handle toward target (extra affordance while dragging) */
  .mwv-guide{position:absolute;left:50%;top:50%;width:200px;height:50px;margin:-25px 0 0 -100px;
    border:2px solid rgba(255,255,255,.25);border-radius:50%;opacity:0;pointer-events:none;
    transform-origin:50% 50%;transform:scaleX(0);transition:opacity .15s;z-index:1;}
  /* handle: real AOSP ic_lockscreen_handle_normal.png (162x162: transparent circle, white border, lock icon) */
  .mwv-handle{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;
    display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;z-index:3;
    transition:transform .22s cubic-bezier(.2,.7,.3,1);will-change:transform;}
  .mwv-handle img{width:80px;height:80px;pointer-events:none;}
  .mwv-handle.dragging{transition:none;cursor:grabbing;}
  /* targets: real AOSP ic_lockscreen_camera_normal / unlock_normal 162x162, 135dp offset from center */
  .mwv-target{position:absolute;top:50%;width:80px;height:80px;margin-top:-40px;
    display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .18s cubic-bezier(.2,.8,.3,1);
    opacity:.85;}
  .mwv-target img{width:80px;height:80px;pointer-events:none;}
  .mwv-target.l{left:50%;transform:translate(calc(-50% - 135px),-50%);}
  .mwv-target.r{left:50%;transform:translate(calc(-50% + 135px),-50%);}
  .mwv-target.hot{transform:translate(-50%,-50%) scale(1.2);opacity:1;}
  .mwv-target.l.hot{transform:translate(calc(-50% - 135px),-50%) scale(1.2);opacity:1;}
  .mwv-target.r.hot{transform:translate(calc(-50% + 135px),-50%) scale(1.2);opacity:1;}
  .mwv-chev{position:absolute;right:18px;top:50%;margin-top:-32px;opacity:0;pointer-events:none;
    animation:chevHint 1.6s ease .9s forwards;}
  @keyframes chevHint{0%{opacity:0;transform:translateX(4px)}25%{opacity:.85}70%{opacity:.85}100%{opacity:0;transform:translateX(-4px)}}
  .mwv-chev img{width:14px;height:54px;}
  .lock-carrier{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;
    color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.45);}

  /* ===== home / launcher (ICS Launcher2 DragLayer: qsb top, 5-page workspace, dock divider, hotseat) ===== */
  #home{background:transparent;}
  .gsearch{margin:12px 10px 4px;height:42px;background:rgba(0,0,0,.35);border-radius:4px;display:flex;align-items:center;padding:0 12px;gap:10px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);}
  .gsearch svg{width:18px;height:18px;fill:#fff;opacity:.9;}
  .gsearch img{width:18px;height:18px;opacity:.9;}
  .gsearch .q{flex:1;color:#e8edf3;font-size:14px;letter-spacing:.3px;}
  .gsearch .mic{width:18px;height:18px;fill:#fff;opacity:.9;}
  /* ICS Workspace: 5 swipeable pages, 4x4 grid each, page-dots indicator */
  .workspace{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .workspace::-webkit-scrollbar{display:none;}
  .ws-page{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px;padding:16px 12px;align-content:start;}
  .page-ind{display:flex;justify-content:center;gap:7px;padding:5px 0 4px;flex-shrink:0;}
  .page-ind i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:.2s;}
  .page-ind i.on{background:#fff;}
  /* workspace_divider: thin line just above the hotseat */
  .dock-div{height:1px;background:rgba(255,255,255,.10);margin:0 10px;flex-shrink:0;}
  .app{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;}
  .app .tile{width:56px;height:56px;display:flex;align-items:center;justify-content:center;transition:transform .1s;}
  .app:active .tile{transform:scale(.88);}
  .app .tile img{width:48px;height:48px;object-fit:contain;}
  .app .tile img.muted{filter:brightness(0) invert(1);}
  .app .tile svg{width:34px;height:34px;fill:#fff;}
  .app .lbl{font-size:11px;color:#e8eef4;text-shadow:0 1px 2px rgba(0,0,0,.6);}
  /* ICS hotseat: 5 cells, dark panel (hotseat_bg_panel), drawer grid icon centered */
  .dock{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(0,0,0,.38);border-radius:20px 20px 4px 4px;padding:12px 8px;margin:0 8px 8px;}
  .dock .app .tile{width:50px;height:50px;border-radius:13px;}
  .apps-btn{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:transform .1s;}
  .apps-btn:active{transform:scale(.88);}
  .apps-btn svg{width:34px;height:34px;fill:#fff;}

  /* ===== app drawer (ICS AppsCustomizeTabHost: solid black, Apps|Widgets tabs) ===== */
  #drawer{background:#000;}
  .drawer-tabs{display:flex;align-items:center;justify-content:center;height:48px;flex-shrink:0;border-bottom:1px solid #111;position:relative;}
  .drawer-tab{font-size:14px;color:#9a9a9a;padding:0 22px;height:48px;display:flex;align-items:center;position:relative;cursor:pointer;}
  .drawer-tab.on{color:#fff;}
  .drawer-tab.on::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:3px;background:#33b5e5;}
  .drawer-market{position:absolute;right:14px;top:0;height:48px;display:flex;align-items:center;cursor:pointer;}
  .drawer-market svg{width:20px;height:20px;fill:#aaa;}
  .drawer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px;padding:14px 12px 24px;align-content:start;}
  .drawer-grid:not(.on){display:none;}
  .drawer-widgets{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:14px 12px 24px;align-content:start;}
  .drawer-widgets:not(.on){display:none;}
  .wcard{background:#161616;border-radius:8px;padding:14px;color:#cfcfcf;font-size:12px;border:1px solid #222;}
  .wcard .wt{font-size:13px;color:#fff;margin-bottom:6px;font-weight:500;}

  /* ===== action bar (apps) ===== */
  .actionbar{height:48px;background:linear-gradient(#2c2c2c,#1f1f1f);border-bottom:1px solid #000;
    display:flex;align-items:center;padding:0 6px 0 4px;gap:6px;flex-shrink:0;box-shadow:0 1px 0 #000;}
  .ab-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ab-icon img{width:26px;height:26px;object-fit:contain;filter:brightness(0) invert(1);}
  .ab-icon svg{width:24px;height:24px;fill:#fff;}
  .ab-divider{width:1px;height:26px;background:rgba(255,255,255,.15);margin:0 4px;}
  .ab-up{width:24px;height:24px;position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .ab-up img{width:22px;height:22px;}
  .ab-up::before,.ab-up::after{display:none;}
  .ab-title{font-size:18px;font-weight:400;flex:1;letter-spacing:.3px;}
  .ab-action{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:2px;}
  .ab-action:hover{background:rgba(255,255,255,.1);}
  .ab-action svg{width:22px;height:22px;fill:#fff;}
  .muted{filter:brightness(0) invert(1);}
  .gsearch img{width:18px;height:18px;opacity:.85;}
  .ab-action img{width:22px;height:22px;}
  .sb-alarm{width:14px;height:14px;}
  .ab-overflow{width:22px;height:22px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;}
  .ab-overflow i{width:4px;height:4px;border-radius:50%;background:#fff;}

  /* ===== holo settings list ===== */
  .list{background:var(--bg);}
  .grp-title{font-size:13px;color:var(--blue);padding:16px 16px 6px;font-weight:500;letter-spacing:.5px;}
  .item{display:flex;align-items:center;height:56px;padding:0 16px;gap:18px;cursor:pointer;background:transparent;border-bottom:1px solid var(--divider);}
  .item:active{background:#1a1a1a;}
  .item .ic{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .item .ic img{width:24px;height:24px;object-fit:contain;filter:brightness(0) invert(1);}
  .item .ic svg{width:22px;height:22px;fill:#fff;}
  .item .body{flex:1;min-width:0;}
  .item .t{font-size:16px;color:var(--txt);}
  .item .s{font-size:14px;color:var(--txt2);margin-top:2px;}
  .item .val{font-size:13px;color:var(--txt2);}
  .item .chev{color:#5a5a5a;font-size:18px;}
  .prog{height:4px;background:#2a2a2a;border-radius:2px;margin:10px 16px 0;overflow:hidden;}
  .prog i{display:block;height:100%;width:72%;background:var(--blue);}
  .btns{padding:20px 16px 8px;display:flex;gap:12px;}
  .hbtn{flex:1;height:42px;border:none;border-radius:2px;font-size:14px;font-weight:500;cursor:pointer;letter-spacing:.4px;
    background:linear-gradient(#3c3c3c,#2a2a2a);color:#fff;box-shadow:inset 0 0 0 1px #111,0 1px 0 #000;}
  .hbtn:active{box-shadow:inset 0 0 0 1px #111,inset 0 0 0 999px var(--hl);}
  .hbtn.primary{background:linear-gradient(#3fc3ef,#1fa9d6);box-shadow:inset 0 0 0 1px #1b93bb;}
  .hbtn.primary:active{background:linear-gradient(#33b5e5,#159ac6);}
  /* App Details (settings → appinfo) — modeled on PackageManager's app info */
  .apphead{display:flex;align-items:center;gap:14px;padding:18px 16px;border-bottom:1px solid var(--divider);}
  .apphead-icon{width:48px;height:48px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .apphead-icon img{width:40px;height:40px;object-fit:contain;}
  .apphead-text{flex:1;min-width:0;}
  .apphead-name{font-size:18px;color:#fff;font-weight:500;}
  .apphead-ver{font-size:12px;color:var(--txt2);margin-top:4px;}
  .appstorage{padding:14px 16px;}
  .appstorage-bar{height:6px;background:#2a2a2a;border-radius:3px;overflow:hidden;}
  .appstorage-fill{height:100%;background:linear-gradient(90deg,#3fc3ef,#1fa9d6);}
  .appstorage-row{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--txt2);}
  .appstorage-v{color:#fff;}
  .btnrow{display:flex;gap:12px;padding:8px 16px 16px;}
  .btnrow .hbtn{flex:1;}
  .kv-row,.perm-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--divider);font-size:15px;}
  .kv-k,.perm-k{color:var(--txt);}
  .kv-v,.perm-v{color:var(--txt2);}

  /* native holo switch */
  .switch{width:52px;height:18px;border-radius:2px;background:#3a3a3a;position:relative;flex-shrink:0;transition:background .18s;box-shadow:inset 0 0 0 1px #000;cursor:pointer;}
  .switch.on{background:var(--blue);}
  .switch i{position:absolute;top:1px;left:1px;width:16px;height:16px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.5);transition:left .18s;}
  .switch.on i{left:35px;}
  /* checkbox */
  .chk{width:20px;height:20px;border-radius:2px;background:#3a3a3a;flex-shrink:0;position:relative;box-shadow:inset 0 0 0 1px #000;cursor:pointer;}
  .chk.on{background:var(--blue);}
  .chk.on::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);}
  .chkimg{width:20px;height:20px;object-fit:contain;}
  .sld{width:120px;height:18px;display:flex;align-items:center;flex-shrink:0;position:relative;cursor:pointer;touch-action:none;}
  .sld::before{content:'';position:absolute;left:0;right:0;height:4px;border-radius:2px;background:#2a2a2a;}
  .sld-f{position:absolute;left:0;height:4px;border-radius:2px;background:var(--blue);}
  .sld-t{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.5);transform:translateX(-50%);}

  /* ===== ripple ===== */
  .ripple{position:relative;overflow:hidden;}
  .ripple-dot{position:absolute;border-radius:50%;background:rgba(51,181,229,.30);transform:scale(0);animation:rip .6s ease-out;pointer-events:none;}
  @keyframes rip{to{transform:scale(2.4);opacity:0}}

  /* ===== nav bar (ICS NavigationBarView: solid #000, back/home/recent 80dp keys, flex spacers) ===== */
  .navbar{height:48px;background:#000;display:flex;align-items:stretch;flex-shrink:0;position:relative;z-index:30;}
  .nav-sp{width:40px;flex-shrink:0;}
  .nav-sp.flex{width:auto;flex:1;flex-shrink:0;}
  .nav{width:80px;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
  .nav img{width:24px;height:24px;object-fit:contain;}
  .nav:active{background:radial-gradient(circle,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 62%);}

  /* ===== ICS Easter Egg: PlatLogoActivity ===== */
  #platlogo{background:#1a1a1a;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .platlogo-stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
  .platlogo-content{display:flex;flex-direction:column;align-items:center;gap:18px;transform-origin:center center;transition:transform .18s cubic-bezier(.2,.7,.3,1);user-select:none;cursor:pointer;}
  .platlogo-bugdroid{width:84px;height:104px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
  .platlogo-text{text-align:center;color:#9bd441;}
  .platlogo-version{font-size:36px;font-weight:300;letter-spacing:2px;line-height:1;}
  .platlogo-version-sub{font-size:64px;font-weight:200;letter-spacing:3px;line-height:1;margin-top:2px;}
  .platlogo-name{font-size:18px;font-weight:400;letter-spacing:6px;margin-top:14px;color:#fff;text-transform:uppercase;}

  /* ===== ICS Easter Egg: Nyandroid (Nyan Cat screensaver) ===== */
  #nyandroid{background:#003366;overflow:hidden;padding:0;}
  .nyandroid-board{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .ncat,.nstar{position:absolute;pointer-events:none;will-change:transform,left;image-rendering:pixelated;}
  .ncat{width:48px;height:48px;}
  .nstar{width:14px;height:14px;}

  .toast{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:rgba(30,30,30,.96);
    color:#fff;font-size:13px;padding:10px 18px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80;box-shadow:0 2px 10px rgba(0,0,0,.6);white-space:nowrap;}
  .toast.show{opacity:1;}

  /* ===== status-bar notification icons (dynamic) ===== */
  .sbni{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;}
  .sbni svg{width:14px;height:14px;fill:#fff;}
  .sbni img{width:14px;height:14px;object-fit:contain;filter:brightness(0) invert(1);}

  /* ===== notification drawer (status-bar pull-down) ===== */
  #notif{position:absolute;left:0;right:0;top:25px;bottom:46px;background:#1a1a1a;z-index:50;
    transform:translateY(calc(-100% - 25px));transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.6);}
  /* status_bar_expanded header: 52dp, Date left (16sp holo_blue), settings + clear icons right */
  .notif-bar{height:52px;background:linear-gradient(#232323,#161616);display:flex;align-items:center;padding:0 4px 0 16px;gap:0;flex-shrink:0;}
  .notif-date{font-size:16px;color:#33b5e5;flex:1;text-align:left;white-space:nowrap;}
  .notif-icon-btn{width:40px;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 8px;flex-shrink:0;}
  .notif-icon-btn:active{background:rgba(255,255,255,.1);}
  .notif-icon-btn img{width:24px;height:24px;object-fit:contain;}
  /* 2dp status_bar_hr divider */
  .notif-hr{height:2px;background:rgba(255,255,255,.08);flex-shrink:0;}
  /* Quick Settings grid (Android 4.2 QuickSettingsTileView: 4-col grid, icon + label) */
  .qs-panel{display:none;flex-shrink:0;background:#141414;padding:10px 8px 4px;}
  .qs-panel.show{display:block;animation:qsIn .22s ease;}
  @keyframes qsIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .qs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
  .qs-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    height:86px;border-radius:4px;background:#1f1f1f;cursor:pointer;user-select:none;}
  .qs-tile:active{background:#2a2a2a;}
  .qs-tile img{width:40px;height:40px;object-fit:contain;}
  .qs-tile span{font-size:11px;color:#ddd;}
  .qs-tile.off img{opacity:.35;filter:grayscale(1);}
  .qs-tile.off span{color:#888;}
  .qs-tile[data-go="1"] img{filter:grayscale(0);}
  .qs-brightness{display:flex;align-items:center;gap:12px;padding:12px 8px 6px;}
  .qs-bric{width:26px;height:26px;object-fit:contain;flex-shrink:0;}
  .qs-sld{flex:1;height:4px;background:#333;border-radius:2px;position:relative;touch-action:none;}
  .qs-sld-f{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3fc3ef,#1fa9d6);border-radius:2px;}
  .qs-sld-t{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.5);}
  .notif-list{flex:1;overflow-y:auto;}
  /* notification rows: 65dp each, 48dp large icon left, text content right */
  .notif-item{display:flex;align-items:center;gap:12px;min-height:65px;padding:8px 14px;border-bottom:1px solid #2a2a2a;cursor:pointer;}
  .notif-item:active{background:#222;}
  .notif-ic{width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;}
  .notif-ic img{width:32px;height:32px;object-fit:contain;}
  .notif-ic svg{width:28px;height:28px;fill:#e0e0e0;}
  .notif-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .notif-title{font-size:14px;color:#fff;font-weight:500;}
  .notif-text{font-size:13px;color:#bbb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .notif-time{font-size:11px;color:#888;}
  .notif-empty{padding:20px;text-align:center;color:#888;font-size:14px;}
  .notif-item:active{background:#161616;}

  /* ===== dialer ===== */
  .dial-display{height:66px;display:flex;align-items:center;padding:0 18px;gap:10px;margin-top:6px;}
  .dial-num{flex:1;font-size:30px;font-weight:300;color:#fff;text-align:right;letter-spacing:1px;overflow:hidden;white-space:nowrap;}
  .dial-del{width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.85;flex-shrink:0;}
  .dial-del svg{width:26px;height:26px;fill:#fff;}
  .dial-del img{width:26px;height:26px;}
  .dial-del:active{opacity:.4;}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;gap:2px 0;padding:2px 8px 8px;
    background:rgba(0,0,0,.25);border-radius:8px;margin:0 8px;}
  /* real AOSP dial keys: dial_num_*_wht.png 135x94 (hdpi), one per cell, centered */
  .key{width:135px;height:auto;cursor:pointer;opacity:.95;}
  .key:active{opacity:1;filter:brightness(1.25);}
  .dial-call{width:62px;height:62px;border-radius:50%;background:var(--green);margin:18px auto 0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.5);}
  .dial-call svg{width:30px;height:30px;fill:#fff;}
  .dial-call img{width:30px;height:30px;}
  .dial-call:active{background:var(--green-d);}

  /* ===== messaging (conversation list) ===== */
  .msg-list{background:var(--bg);}
  .msg-item{display:flex;align-items:center;height:72px;padding:0 16px;gap:14px;cursor:pointer;border-bottom:1px solid var(--divider);}
  .msg-item:active{background:#1a1a1a;}
  .msg-av{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;color:#fff;}
  .msg-body{flex:1;min-width:0;}
  .msg-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .msg-name{font-size:16px;color:#fff;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .msg-time{font-size:12px;color:var(--hint);flex-shrink:0;}
  .msg-snip{font-size:14px;color:var(--txt2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ===== camera ===== */
  #camera{background:#000;}
  .cam-view{flex:1;position:relative;overflow:hidden;background:#000;}
  #camVideo{width:100%;height:100%;object-fit:cover;display:block;}
  .cam-grid{position:absolute;inset:0;pointer-events:none;opacity:.45;
    background:
      linear-gradient(rgba(255,255,255,.15) 1px,transparent 1px) 0 0/100% 33.34%,
      linear-gradient(90deg,rgba(255,255,255,.15) 1px,transparent 1px) 0 0/33.34% 100%;}
  .cam-bar{height:96px;background:#000;display:flex;align-items:center;justify-content:space-around;flex-shrink:0;}
  .cam-thumb{width:48px;height:48px;border-radius:4px;background-size:cover;background-position:center;background-color:#222;cursor:pointer;}
  .cam-shutter{width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid #cfcfcf;cursor:pointer;transition:transform .1s;}
  .cam-shutter:active{transform:scale(.9);}
  .cam-placeholder{width:48px;height:48px;}

  /* ===== gallery ===== */
  #gallery{background:var(--bg);}
  .gal-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;align-content:start;overflow-y:auto;}
  .gal-cell{aspect-ratio:1;overflow:hidden;cursor:pointer;background:#111;}
  .gal-cell img{width:100%;height:100%;object-fit:cover;}
  .gal-empty{padding:48px 16px;text-align:center;color:var(--hint);font-size:14px;grid-column:1/-1;}
  #galView{position:absolute;inset:0;background:#000;z-index:90;display:none;align-items:center;justify-content:center;}
  #galView img{max-width:100%;max-height:100%;object-fit:contain;}
  .gal-close{position:absolute;top:8px;right:16px;color:#fff;font-size:28px;line-height:1;cursor:pointer;z-index:91;}

  /* ===== Recents / multitasking (ICS 4.0.4 status_bar_recent_panel.xml / recent_item.xml) ===== */
  #recents{background:rgba(0,0,0,.70);} /* status_bar_recents_background_solid #b3000000 */
  .rec-head{font-size:14px;color:#fff;padding:16px 0 8px;text-align:center;flex-shrink:0;letter-spacing:.5px;}
  .rec-list{flex:1;overflow-y:auto;padding:8px 0 20px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .rec-item{position:relative;width:300px;max-width:90%;height:150px;border-radius:3px;overflow:hidden;
    background:#1c1c1c;box-shadow:0 1px 8px rgba(0,0,0,.55);cursor:pointer;touch-action:pan-y;
    border:1px solid rgba(255,255,255,.08);}
  .rec-item .ri-thumb{position:absolute;top:0;right:0;width:184px;height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .rec-item .ri-thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);}
  .rec-item .ri-thumb .ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .rec-item .ri-thumb .ph svg{width:50px;height:50px;fill:rgba(255,255,255,.9);}
  .rec-item .ri-callout{position:absolute;left:0;top:28px;width:104px;height:1px;background:rgba(255,255,255,.22);}
  .rec-item .ri-label{position:absolute;left:8px;top:6px;width:96px;font-size:14px;color:#fff;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.6);}
  .rec-item .ri-icon{position:absolute;left:8px;top:32px;width:36px;height:36px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(255,255,255,.06);}
  .rec-item .ri-icon img{width:100%;height:100%;object-fit:contain;}
  .rec-item .ri-icon svg{width:24px;height:24px;fill:#fff;}
  .rec-item .ri-desc{position:absolute;left:8px;top:78px;width:96px;font-size:12px;color:rgba(255,255,255,.65);line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.6);}
  .rec-empty{padding:90px 16px;text-align:center;color:#33b5e5;font-size:20px;} /* holo_blue_light, 20dp */
  .rec-menu{position:fixed;z-index:60;background:#2b2b2b;border:1px solid #4a4a4a;border-radius:4px;
    box-shadow:0 6px 20px rgba(0,0,0,.6);overflow:hidden;min-width:168px;}
  .rec-menu div{padding:13px 20px;font-size:14px;color:#fff;cursor:pointer;}
  .rec-menu div:active{background:#33b5e5;color:#000;}

  /* ===== shared action-bar title/url tweaks ===== */
  .br-url{flex:1;height:32px;background:rgba(255,255,255,.12);border-radius:4px;display:flex;align-items:center;padding:0 10px;font-size:13px;color:#dfe6ec;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}

  /* ===== Browser ===== */
  #browser{background:#fff;color:#222;}
  .br-body{flex:1;overflow-y:auto;background:#fff;}
  .br-start{padding:24px 16px;}
  .br-start h3{font-size:15px;color:#666;font-weight:500;margin-bottom:14px;}
  .br-bm{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 6px;}
  .br-bm a{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:#333;text-decoration:none;font-size:12px;}
  .br-bm .bm-ic{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:18px;}
  .br-page{padding:22px 18px;line-height:1.7;font-size:14px;color:#333;}
  .br-page h1{font-size:22px;color:#33b5e5;margin-bottom:10px;}
  .br-page p{margin-bottom:12px;}
  .br-page .tag{display:inline-block;background:#e6f6fb;color:#1a8bb0;padding:2px 8px;border-radius:3px;font-size:12px;margin-right:6px;}

  /* ===== Calendar ===== */
  #calendar{background:#0e0e0e;}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);background:#111;border-bottom:1px solid #222;}
  .cal-week span{text-align:center;font-size:11px;color:#888;padding:8px 0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);flex:1;}
  .cal-cell{aspect-ratio:1/1;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-size:14px;color:#ddd;border-right:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;position:relative;cursor:pointer;}
  .cal-cell.dim{color:#555;}
  .cal-cell.today{color:#fff;font-weight:700;}
  .cal-cell.today::after{content:"";position:absolute;bottom:8px;width:5px;height:5px;border-radius:50%;background:#33b5e5;}
  .cal-cell .dot{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:#99cc00;}

  /* ===== Clock ===== */
  #clock{background:#0e0e0e;}
  .clk-tabs{display:flex;background:#111;border-bottom:1px solid #222;}
  .clk-tab{flex:1;text-align:center;padding:12px 0;font-size:13px;color:#999;cursor:pointer;border-bottom:2px solid transparent;}
  .clk-tab.on{color:#fff;border-bottom-color:#33b5e5;}
  .clk-body{flex:1;overflow-y:auto;}
  .clk-row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #1c1c1c;}
  .clk-row .nm{flex:1;font-size:15px;color:#eee;}
  .clk-row .tm{font-size:15px;color:#bbb;}
  .clk-empty{padding:50px 16px;text-align:center;color:#666;font-size:14px;}
  .clk-center{padding:34px 16px;text-align:center;}
  .big-time{font-size:54px;font-weight:300;color:#fff;font-variant-numeric:tabular-nums;}
  .clk-sub{font-size:13px;color:#888;margin-top:6px;}
  .timer-set{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px 0;}
  .timer-set input{width:64px;background:#1a1a1a;border:1px solid #333;color:#fff;font-size:30px;text-align:center;border-radius:6px;padding:6px;font-variant-numeric:tabular-nums;}
  .clk-btn{margin:14px auto;display:block;background:#33b5e5;color:#fff;border:none;padding:12px 30px;border-radius:4px;font-size:15px;cursor:pointer;}
  .clk-btn.sec{background:#2a2a2a;}
  .lap{font-size:13px;color:#bbb;padding:6px 16px;border-bottom:1px solid #1c1c1c;display:flex;justify-content:space-between;}

  /* ===== Calculator ===== */
  #calculator{background:#1a1a1a;}
  .calc-disp{background:#1a1a1a;color:#fff;font-size:46px;font-weight:300;text-align:right;padding:26px 18px 14px;min-height:92px;line-height:1.1;overflow:hidden;font-variant-numeric:tabular-nums;}
  .calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#2a2a2a;flex:1;}
  .calc-keys button{border:none;font-size:22px;color:#fff;background:#2b2b2b;cursor:pointer;padding:0;transition:background .1s;font-family:'Roboto',sans-serif;}
  .calc-keys button:active{background:#3d3d3d;}
  .calc-keys .ck.fun{background:#1f1f1f;color:#cfcfcf;}
  .calc-keys .ck.op{background:#33b5e5;color:#fff;font-size:26px;}
  .calc-keys .ck.op:active{background:#2aa3cf;}
  .calc-keys .ck.zero{grid-column:span 2;}
  .calc-keys .ck.eq{background:#33b5e5;}

  /* ===== Email ===== */
  #email{background:#0e0e0e;}
  .email-list{flex:1;overflow-y:auto;}
  .email-item{padding:13px 16px;border-bottom:1px solid #1c1c1c;cursor:pointer;}
  .email-item .e-from{font-size:15px;color:#fff;font-weight:500;}
  .email-item .e-sub{font-size:13px;color:#ccc;margin-top:2px;}
  .email-item .e-prev{font-size:12px;color:#888;margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .email-item .e-time{float:right;font-size:11px;color:#777;}
  .email-detail{padding:18px 16px;color:#eee;line-height:1.7;font-size:14px;}
  .email-detail .ed-from{font-size:16px;font-weight:600;}
  .email-detail .ed-sub{font-size:14px;color:#aaa;margin:2px 0 12px;}
  .email-detail .ed-body{color:#ddd;}

  /* ===== Music ===== */
  #music{background:#0e0e0e;}
  .music-list{flex:1;overflow-y:auto;}
  .music-item{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid #1c1c1c;cursor:pointer;gap:12px;}
  .music-item .m-art{width:42px;height:42px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;}
  .music-item .m-info{flex:1;min-width:0;}
  .music-item .m-title{font-size:14px;color:#fff;}
  .music-item .m-artist{font-size:12px;color:#999;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .music-item.playing .m-title{color:#33b5e5;}
  .nowplaying{background:#161616;border-top:1px solid #222;padding:10px 14px 14px;}
  .np-art{width:46px;height:46px;border-radius:6px;float:left;margin-right:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;}
  .np-info{overflow:hidden;}
  .np-title{font-size:14px;color:#fff;}
  .np-artist{font-size:12px;color:#999;}
  .np-prog{height:3px;background:#333;border-radius:2px;margin:10px 0 8px;clear:both;}
  .np-prog-f{height:100%;width:0;background:#33b5e5;border-radius:2px;}
  .np-ctrl{display:flex;justify-content:center;gap:34px;align-items:center;}
  .np-b{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .np-b svg{width:28px;height:28px;fill:#fff;}
  #npPlay svg{width:34px;height:34px;fill:#33b5e5;}

  /* ===== Contacts ===== */
  #contacts{background:#0e0e0e;}
  .contacts-list{flex:1;overflow-y:auto;}
  .contact-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #1c1c1c;cursor:pointer;}
  .contact-item .c-av{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600;}
  .contact-item .c-name{font-size:15px;color:#fff;}
  .contact-detail{position:absolute;inset:0;background:#0e0e0e;display:none;flex-direction:column;padding-top:0;z-index:80;}
  .contact-detail.on{display:flex;}
  .cd-head{padding:26px 16px;text-align:center;border-bottom:1px solid #222;}
  .cd-av{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:600;}
  .cd-name{font-size:22px;color:#fff;}
  .cd-row{padding:16px;border-bottom:1px solid #1c1c1c;color:#eee;font-size:14px;}
  .cd-row .cd-l{font-size:12px;color:#888;margin-bottom:2px;}

  /* ===== Downloads ===== */
  #downloads{background:#0e0e0e;}
  .dl-list{flex:1;overflow-y:auto;}
  .dl-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #1c1c1c;}
  .dl-item .dl-ic{width:40px;height:40px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;}
  .dl-item .dl-info{flex:1;min-width:0;}
  .dl-item .dl-name{font-size:14px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .dl-item .dl-meta{font-size:12px;color:#999;margin-top:2px;}

  /* ===== Sound Recorder ===== */
  #recorder{background:#0e0e0e;}
  .rec-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;}
  .rec-time{font-size:46px;font-weight:300;color:#fff;font-variant-numeric:tabular-nums;}
  .rec-btn{width:92px;height:92px;border-radius:50%;background:#ff4444;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 18px rgba(255,68,68,.4);transition:transform .1s;}
  .rec-btn:active{transform:scale(.92);}
  .rec-btn svg{width:42px;height:42px;fill:#fff;}
  .rec-btn.recording{background:#cc3333;animation:recpulse 1.2s infinite;}
  @keyframes recpulse{0%,100%{box-shadow:0 4px 18px rgba(255,68,68,.4);}50%{box-shadow:0 4px 26px rgba(255,68,68,.8);}}
  .rec-hint{font-size:13px;color:#999;}
  .rec-list{flex:1;overflow-y:auto;border-top:1px solid #222;width:100%;}
  .rec-clip{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #1c1c1c;}
  .rec-clip .rc-ic{width:38px;height:38px;border-radius:7px;background:#33b5e5;display:flex;align-items:center;justify-content:center;color:#fff;}
  .rec-clip .rc-info{flex:1;}
  .rec-clip .rc-name{font-size:14px;color:#fff;}
  .rec-clip .rc-meta{font-size:12px;color:#999;}
</style>
</head>

    const wp=document.querySelector('.wallpaper');
    if(wp) wp.style.display=(id==='home'||id==='lock')?'block':'none';
    if(id==='drawer'){screens[id].classList.add('drawer-open');setTimeout(()=>screens[id].classList.remove('drawer-open'),320);}
    if(fromRect){
      const r=screens[id].getBoundingClientRect();
      const dx=fromRect.left+fromRect.width/2-(r.left+r.width/2);
      const dy=fromRect.top+fromRect.height/2-(r.top+r.height/2);
      const sc=fromRect.width/r.width;
      const el=screens[id];
      el.style.setProperty('--ox',dx+'px');
      el.style.setProperty('--oy',dy+'px');
      el.style.setProperty('--os',sc);
      el.classList.add('app-open');
      setTimeout(()=>el.classList.remove('app-open'),300);

    ind.innerHTML=Array.from({length:WS},(_,i)=>`<i class="${i===start?'on':''}" data-p="${i}"></i>`).join('');

  function sIcon(it){
    if(it.img) return `<img src='${it.img}' alt=''>`;

    return '';

  function sRow(it){
    let right='';
    if(it.sw!==undefined) right+=`<div class='switch ${it.sw?'on':''}' data-sw='${it.key||''}'><i></i></div>`;
    else if(it.chk) right+=`<img class='chkimg' data-chk src='assets/aosp_check_on.png'>`;
    else if(it.slider) right+=`<div class='sld' data-sld='${it.key}'><div class='sld-f' style='width:${it.val||50}%'></div><i class='sld-t' style='left:${it.val||50}%'></i></div>`;
    else if(it.v) right+=`<div class='val'>${it.v}</div>`;
    if((it.go||it.action)&&it.chev!==false) right+=`<div class='chev'>›</div>`;
    const cls=(it.go||it.action)?'item ripple':'item';
    return `<div class='${cls}' ${it.go?`data-go='${it.go}'`:''} ${it.action?`data-action='${it.action}'`:''} ${it.app?`data-app='${it.app}'`:''} ${it.egg?`data-egg='1'`:''}>
      <div class='ic'>${sIcon(it)}</div><div class='body'><div class='t'>${it.t}</div>${it.s?`<div class='s'>${it.s}</div>`:''}</div>${right}</div>`;

      }
      if(it.kind==='storage'){
        const pct=Math.round(it.app/it.total*100);
        return `<div class="appstorage"><div class="appstorage-bar"><div class="appstorage-fill" style="width:${pct}%"></div></div><div class="appstorage-row"><span>应用</span><span class="appstorage-v">${it.app} MB</span></div></div>`;
      }
      if(it.kind==='grp') return `<div class="grp-title">${it.label}</div>`;
      if(it.kind==='btnrow'){
        return `<div class="btnrow">${it.btns.map(b=>`<button class="hbtn" data-action="${b[1]}">${b[0]}</button>`).join('')}</div>`;

      if(it.kind==='kv') return `<div class="kv-row"><span class="kv-k">${it.k}</span><span class="kv-v">${it.v}</span></div>`;
      if(it.kind==='perm') return `<div class="perm-row"><span class="perm-k">${it.k}</span><span class="perm-v">${it.n}</span></div>`;
      return sRow(it);
    };
    if(n.groups){ n.groups.forEach(g=>{ html+=`<div class='grp-title'>${g.name}</div>`; g.items.forEach(it=>html+=renderItem(it)); }); }

  /* ===== ICS Easter Egg (com.android.internal.app.PlatLogoActivity + com.android.systemui.Nyandroid) =====
     Trigger: Settings → About phone → tap "Android 版本" 3 times within 500ms (DeviceInfoSettings.mHits[3] logic).
     PlatLogoActivity: shows the PlatLogo ImageView, tap = toast "Android 4.0: Ice Cream Sandwich";
       long-press (2× long-press-timeout = 1000ms) kicks the mSuperLongPress loop, scaling 1.25/1.5/2.0/2.5,
       then launches Nyandroid.
     Nyandroid: Board extends FrameLayout, background #003366, 20 stars + 20 FlyingCats (Android + rainbow
       trail) flying L→R with random size/speed/z, looping. Any touch exits. */
  const eggHits=[0,0,0];
  function eggTap(){
    eggHits[0]=eggHits[1]; eggHits[1]=eggHits[2]; eggHits[2]=Date.now();
    if(eggHits[0] && eggHits[0] >= Date.now()-500){ eggHits[0]=eggHits[1]=eggHits[2]=0; openPlatLogo(); }
  }

  function openPlatLogo(){
    const c=$('#platlogoContent');
    c.style.transform='scale(1)';
    show('platlogo');
    // Wait a frame then bind listeners (avoid duplicate bindings if re-opened)
    requestAnimationFrame(()=>bindPlatLogo(c));
  }
  function bindPlatLogo(c){
    const LPT=500;                            // ViewConfiguration.getLongPressTimeout()
    let pressed=false, count=0, lpTimer=null, stepTimer=null;
    function resetVisual(){ c.style.transform='scale(1)'; }
    function startLongPress(){
      pressed=true; count=0; resetVisual();
      clearTimeout(lpTimer); clearTimeout(stepTimer);
      // 2 × long-press-timeout initial delay (mSuperLongPress posted with 2*LPT)
      lpTimer = setTimeout(()=>{
        // mSuperLongPress.run()
        count++;
        const scale = 1 + 0.25 * count * count;
        c.style.transform = `scale(${scale})`;
        if(count <= 3){
          stepTimer = setTimeout(()=>{ if(pressed) startLongPress(); }, LPT);  // recursive — same LPT
        } else {
          // count > 3 → startActivity(Nyandroid).finish()
          clearTimeout(lpTimer); clearTimeout(stepTimer);
          openNyandroid();
        }
      }, 2*LPT);
    }
    function endLongPress(){
      clearTimeout(lpTimer); clearTimeout(stepTimer);
      if(pressed){
        pressed=false;
        // ACTION_UP logic: if not yet escalated (still scale 1), show toast
        if(count===0){ t('Android 4.0: Ice Cream Sandwich'); }
        resetVisual();
      }
    }
    c.onmousedown = startLongPress;
    c.onmouseup = endLongPress;
    c.onmouseleave = endLongPress;
    c.ontouchstart = e=>{ e.preventDefault(); startLongPress(); };
    c.ontouchend = e=>{ e.preventDefault(); endLongPress(); };
  }

  let nyandroidRAF=null, nyandroidTimers=[];
  function openNyandroid(){
    // Clean up any previous instance
    if(nyandroidRAF) cancelAnimationFrame(nyandroidRAF);
    nyandroidTimers.forEach(id=>clearInterval(id)); nyandroidTimers=[];
    const board=$('#nyandroidBoard');
    board.innerHTML='';
    show('nyandroid');
    // Wait for layout
    requestAnimationFrame(()=>{
      const W=board.clientWidth, H=board.clientHeight;
      const NUM_CATS=20;
      const cats=[], stars=[];
      // spawn 20 cat flying objects (Android + rainbow trail flying L→R)
      for(let i=0;i<NUM_CATS;i++){
        const cat=document.createElement('img');
        cat.className='ncat';
        cat.src='assets/nyan/nyandroid00.png';
        let z=(i/NUM_CATS); z*=z;
        const baseScale = 0.15 + 1.65 * z;       // 0.1 (far) ~ 1.8 (near)
        const v = 100 + 900 * z;                 // VMIN..VMAX
        // intrinsic 48px cell, scale applied via width/height
        cat.style.width = (48 * baseScale) + 'px';
        cat.style.height = (48 * baseScale) + 'px';
        cat.style.top = Math.random()*H + 'px';
        cat.style.left = (-(48*baseScale)+1) + 'px';
        cat.dataset.v = v;
        cat.dataset.scale = baseScale;
        cats.push(cat);
        board.appendChild(cat);
      }
      // spawn 20 fixed twinkling stars
      for(let i=0;i<20;i++){
        const star=document.createElement('img');
        star.className='nstar';
        star.src='assets/nyan/star0.png';
        const scale = 0.1 + Math.random()*0.9;
        star.style.width = (14 * scale) + 'px';
        star.style.height = (14 * scale) + 'px';
        star.style.left = Math.random()*W + 'px';
        star.style.top = Math.random()*H + 'px';
        stars.push(star);
        board.appendChild(star);
      }
      // Shared frame animator: one rAF advances all 12 cat frames + 6 star frames
      let catFrame=0, starFrame=0;
      let catAcc=0, starAcc=0;
      const FRAME_DT=1/60; // 60fps
      const CAT_INTERVAL=80;   // ms per cat frame
      const STAR_INTERVAL=200; // ms per star frame
      let last=performance.now();
      function tick(now){
        const dt = now - last; last = now;
        // advance cat frames every 80ms
        catAcc += dt;
        while(catAcc >= CAT_INTERVAL){
          catFrame = (catFrame+1) % 12;
          for(const c of cats) c.src = `assets/nyan/nyandroid${String(catFrame).padStart(2,'0')}.png`;
          catAcc -= CAT_INTERVAL;
        }
        // advance star frames every 200ms
        starAcc += dt;
        while(starAcc >= STAR_INTERVAL){
          starFrame = (starFrame+1) % 6;
          for(const s of stars) s.src = `assets/nyan/star${starFrame}.png`;
          starAcc -= STAR_INTERVAL;
        }
        // update cat positions
        const dtSec = dt/1000;
        for(const cat of cats){
          const v = parseFloat(cat.dataset.v);
          let x = parseFloat(cat.style.left) + v*dtSec;
          cat.style.left = x + 'px';
        }
        // reset cats that went off the right edge
        for(const cat of cats){
          const scale = parseFloat(cat.dataset.scale);
          const w = 48*scale;
          if(parseFloat(cat.style.left) > W + 2){
            cat.style.left = (-(48*scale)+1) + 'px';
            cat.style.top = Math.random()*H + 'px';
          }
        }
        nyandroidRAF = requestAnimationFrame(tick);
      }
      nyandroidRAF = requestAnimationFrame(tick);
    });
    // any click on the nyandroid screen exits (onUserInteraction → finish)
    board.onclick = ()=>{
      if(nyandroidRAF) cancelAnimationFrame(nyandroidRAF);
      nyandroidRAF=null;
      show('home');
    };
  }

  /* ---- lock MultiWaveView drag (real AOSP 4.0: ONE 270dp wave ring follows handle & stretches into ellipse; right=unlock, LEFT=camera) ---- */
  const mwv=$('#mwv'),mHandle=$('#mwvHandle'),mUnlock=$('#mwvUnlock'),mCam=$('#mwvCam'),mGuide=$('#mwvGuide'),mWave=$('#mwvWave');
  let drag=false,sx=0,dx=0;const pt=e=>e.touches?e.touches[0]:e;
  const SNAP=45,MAX=105;
  function setHandleImg(pressed){mHandle.querySelector('img').src=pressed?'assets/ic_lockscreen_handle_pressed.png':'assets/ic_lockscreen_handle_normal.png';}
  function setTargetImgs(unlockHot,camHot){
    mUnlock.querySelector('img').src=unlockHot?'assets/ic_lockscreen_unlock_activated.png':'assets/ic_lockscreen_unlock_normal.png';
    mCam.querySelector('img').src=camHot?'assets/ic_lockscreen_camera_activated.png':'assets/ic_lockscreen_camera_normal.png';
    mUnlock.classList.toggle('hot',unlockHot);mCam.classList.toggle('hot',camHot);
  }
  function applyDrag(){
    const d=Math.max(-MAX,Math.min(MAX,dx));
    mHandle.style.transform=`translate(${d}px,0)`;
    /* real AOSP: wave ring follows handle and scales horizontally into an ellipse */
    const k=1+Math.abs(d)/MAX*0.55;
    mWave.style.transform=`translate(${d}px,0) scale(${k},1)`;
    /* drag-guide affordance line */
    mGuide.style.opacity=drag?0.85:0;
    mGuide.style.transformOrigin=d>=0?'left center':'right center';
    mGuide.style.transform=`scaleX(${0.25+Math.abs(d)/MAX*1.1})`;
    setTargetImgs(d>SNAP/2,dx<-SNAP/2);
  }
  function startDrag(e){drag=true;sx=pt(e).clientX;setHandleImg(true);mHandle.classList.add('dragging');mWave.classList.add('drag');mGuide.style.transition='none';mHandle.style.transition='none';mWave.style.transition='none';applyDrag();}
  function mv(e){if(!drag)return;dx=pt(e).clientX-sx;applyDrag();if(e.cancelable)e.preventDefault();}
  function endDrag(){if(!drag)return;drag=false;setHandleImg(false);setTargetImgs(false,false);
  const d=dx;dx=0;
  mHandle.classList.remove('dragging');mWave.classList.remove('drag');
  mHandle.style.transition='';mHandle.style.transform='';
  mWave.style.transition='';mWave.style.transform='';
  mGuide.style.transition='';mGuide.style.opacity=0;mGuide.style.transform='scaleX(0)';
  if(d>SNAP)fly(180,()=>show('home'));
  else if(d<-SNAP)fly(-180,()=>show('camera'));
  else mHandle.style.transform='';
  }

      let left=300,running=false;
      const disp=()=>{$('#tmDisp').textContent=fmt2(Math.floor(left/60))+':'+fmt2(left%60);};
      $('#tmStart').addEventListener('click',()=>{
        if(running){clearClk();running=false;$('#tmStart').textContent='开始';return;}
        if(left<=0)left=(+ $('#tmMin').value||5)*60;

      });

  let cCur='0',cPrev=null,cOp=null,cEval=false;
  function cShow(){const s=cCur.length>12?cCur.slice(0,12):cCur;$('#calcDisp').textContent=s;}
  function cCompute(a,op,b){a=parseFloat(a);b=parseFloat(b);let r=0;if(op==='+')r=a+b;else if(op==='−')r=a-b;else if(op==='×')r=a*b;else if(op==='÷')r=b===0?NaN:a/b;return r;}
  function calcKey(k){
    if(k==='C'){cCur='0';cPrev=null;cOp=null;cEval=false;}
    else if(k==='+/-'){cCur=String(parseFloat(cCur)*-1);}
    else if(k==='%'){cCur=String(parseFloat(cCur)/100);}
    else if(k==='.'){if(!cCur.includes('.'))cCur+='.';}
    else if(k==='+'||k==='−'||k==='×'||k==='÷'){
      if(cOp!==null&&!cEval){const r=cCompute(cPrev,cOp,cCur);cPrev=String(r);cCur=String(r);}else cPrev=cCur;
      cOp=k;cEval=true;
    }
    else if(k==='='){if(cOp!==null){const r=cCompute(cPrev,cOp,cCur);cCur=isFinite(r)?String(r):'错误';cPrev=null;cOp=null;cEval=true;}}
    else{if(cEval){cCur='0';cEval=false;}if(cCur==='0')cCur=k;else cCur+=k;}
    cShow();
  }

  let recOn=false,recSec=0,recTimer=null,recStream=null,recMR=null,recChunks=[],CLIPS=[];
  const recFmt=s=>fmt2(Math.floor(s/60))+':'+fmt2(s%60);
  function renderRecList(){$('#recList2').innerHTML=CLIPS.length?CLIPS.map(c=>`<div class="rec-clip"><div class="rc-ic"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#fff"><use href="#i-play"/></svg></div><div class="rc-info"><div class="rc-name">${c.n}</div><div class="rc-meta">${recFmt(c.d)} · ${c.t}</div></div></div>`).join(''):'<div class="clk-empty">暂无录音</div>';}
  $('#recBtn').addEventListener('click',async()=>{
    if(!recOn){
      recOn=true;recSec=0;$('#recBtn').classList.add('recording');$('#recHint').textContent='录音中…点击停止';
      recTimer=setInterval(()=>{recSec++;$('#recTime').textContent=recFmt(recSec);},1000);
      if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
        try{recStream=await navigator.mediaDevices.getUserMedia({audio:true});recMR=new MediaRecorder(recStream);recChunks=[];
          recMR.ondataavailable=e=>recChunks.push(e.data);recMR.start();}catch(e){recStream=null;recMR=null;}
      }
    } else {
      recOn=false;clearInterval(recTimer);$('#recBtn').classList.remove('recording');$('#recHint').textContent='点击开始录音';$('#recTime').textContent='00:00';
      if(recMR&&recMR.state!=='inactive'){recMR.stop();recMR.onstop=()=>{finishRec();};}else finishRec();
      if(recStream)recStream.getTracks().forEach(tr=>tr.stop());
    }
  });
  function finishRec(){$('#recHint').textContent='点击开始录音';CLIPS.unshift({n:'录音 '+(CLIPS.length+1),d:recSec,t:'刚刚'});renderRecList();t('已保存录音');}
  renderRecList();
</script>
</body>
</html>
